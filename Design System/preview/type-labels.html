<!-- @dsCard group="Type" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 26px 28px; background: var(--surface-solid); display: flex; flex-direction: column; gap: 18px; }
  .eyebrow { color: var(--marron-tierra); }
  .micro-label { color: var(--marron-tierra); }
  .ovl { display: inline-flex; padding: 0.4rem 0.9rem; border-radius: var(--radius-pill);
         background: rgba(239,225,195,0.72); color: var(--brand); font-family: var(--font-display);
         font-style: italic; font-weight: 600; border: 1px solid rgba(216,191,143,0.44); font-size: 15px; }
  .grp { display: flex; flex-direction: column; gap: 6px; }
  .cap { font-family: var(--font-ui); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); }
</style>
</head>
<body>
  <div class="grp">
    <span class="cap">Eyebrow — italic Cormorant, uppercase</span>
    <span class="eyebrow">UNA SELECCIÓN DENTRO DE NUESTRA PROPUESTA INTEGRAL</span>
  </div>
  <div class="grp">
    <span class="cap">Micro-label — Manrope, tracked</span>
    <span class="micro-label">SAN MARTÍN DE LOS ANDES · PATAGONIA ARGENTINA</span>
  </div>
  <div class="grp">
    <span class="cap">Overline pill — italic, champagne field</span>
    <span class="ovl">Inmobiliaria boutique en Patagonia</span>
  </div>
</body>
</html>
