<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 26px 30px; background: var(--surface-solid); display: flex; align-items: center; gap: 28px; }
  img { height: 150px; flex-shrink: 0; }
  .txt { max-width: 380px; }
  .name { font-family: var(--font-display); font-size: 1.7rem; font-weight: 600; color: var(--brand); line-height: 1.05; }
  .sub { font-family: var(--font-display); font-style: italic; font-size: 1.05rem; color: var(--marron-tierra); margin-top: 4px; }
  .desc { font-family: var(--font-ui); font-size: 0.85rem; color: var(--fg-2); margin-top: 14px; line-height: 1.5; }
</style>
</head>
<body>
  <img src="../assets/logo-dc-mark.png" alt="DC monogram with key">
  <div class="txt">
    <div class="name">Denise Catalán</div>
    <div class="sub">Bienes Raíces</div>
    <div class="desc">The mark joins the founder's initials — a high-contrast serif <strong>D</strong> and <strong>C</strong> — with an ornate vintage skeleton key as the connecting stroke. The key signals real estate; the serif lends boutique refinement.</div>
  </div>
</body>
</html>
