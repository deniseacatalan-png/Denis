<!-- @dsCard group="Type" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 26px 28px; background: var(--surface-solid); }
  .label { font-family: var(--font-ui); font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 4px; }
  .spec { color: var(--brand); font-family: var(--font-display); line-height: 0.98; margin-bottom: 16px; }
  .s1 { font-size: 56px; font-weight: 600; }
  .s2 { font-size: 34px; font-weight: 600; }
  .s3 { font-size: 24px; font-style: italic; font-weight: 500; color: var(--fg-2); }
  .meta { font-family: var(--font-ui); font-size: 12px; color: var(--fg-2); margin-top: 2px; }
</style>
</head>
<body>
  <div class="label">Display · Cormorant Garamond</div>
  <div class="spec s1">Disfrutá la tranquilidad</div>
  <div class="spec s2">Plano de ubicaciones</div>
  <div class="spec s3">Donde querés estar</div>
  <div class="meta">Weights 400–700 + italics · used for H1–H3, body copy, and prices. Set tight (line-height ~0.95) at display sizes.</div>
</body>
</html>
