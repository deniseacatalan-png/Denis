<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 30px 24px; background: var(--surface-solid); }
  .row { display: flex; gap: 26px; }
  .item { text-align: center; flex: 1; }
  .box { height: 70px; border-radius: var(--radius-lg); background: #fffaf4; border: 1px solid var(--border); }
  .e1 { box-shadow: 0 10px 22px rgba(77,54,97,0.18); }
  .e2 { box-shadow: 0 18px 36px rgba(77,54,97,0.12); }
  .e3 { box-shadow: 0 18px 40px rgba(77,54,97,0.20); }
  .n { font-family: var(--font-ui); font-size: 12px; font-weight: 700; color: var(--fg-1); margin-top: 14px; }
  .v { font-family: var(--font-ui); font-size: 11px; color: var(--fg-2); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box e1"></div><div class="n">Button</div><div class="v">0 10px 22px / .20 violet</div></div>
    <div class="item"><div class="box e2"></div><div class="n">Card</div><div class="v">0 18px 36px / .14 violet</div></div>
    <div class="item"><div class="box e3"></div><div class="n">Hover lift</div><div class="v">0 18px 40px / .24 violet</div></div>
  </div>
</body>
</html>
