<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 0; background: var(--surface-solid); display: flex; }
  .pane { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 26px; min-height: 200px; }
  .light { background: var(--blanco-calido); border-right: 1px solid var(--border); }
  .dark { background: linear-gradient(150deg, #6e4f82, #4d3661); }
  img { height: 116px; width: auto; display: block; }
  .dark img { filter: brightness(0) invert(1); }
  .cap { font-family: var(--font-ui); font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .light .cap { color: var(--fg-3); }
  .dark .cap { color: rgba(255,250,244,0.82); }
</style>
</head>
<body>
  <div class="pane light">
    <img src="../assets/logo-dc-mark.png" alt="DC monogram">
    <span class="cap">Grafito on warm white</span>
  </div>
  <div class="pane dark">
    <img src="../assets/logo-dc-mark.png" alt="DC monogram reversed">
    <span class="cap">Reversed on brand violet</span>
  </div>
</body>
</html>
