<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 26px; background: var(--surface-solid); display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 0.5rem; border-radius: var(--radius-pill); padding: 0.72rem 1.15rem;
         font-family: var(--font-display); font-size: 1rem; font-weight: 600; cursor: pointer; border: 1px solid rgba(77,54,97,0.14);
         box-shadow: var(--shadow-soft); text-decoration: none; }
  .primary { color: var(--blanco-calido); background: var(--button-gradient); }
  .soft { color: var(--brand); background: rgba(239,225,195,0.82); }
  .nav { color: var(--blanco-calido); background: var(--button-gradient); border-color: rgba(255,250,244,0.42); font-size: 0.94rem; padding: 0.55rem 0.95rem; }
</style>
</head>
<body>
  <a class="btn primary">Hablar por WhatsApp</a>
  <a class="btn soft">Ver ficha técnica</a>
  <a class="btn nav">Solicitar servicios</a>
</body>
</html>
