<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-solid); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
  .stats div { border-radius: var(--radius-md); padding: 0.85rem 0.9rem; background: rgba(255,250,244,0.68); border: 1px solid rgba(77,54,97,0.12); }
  .stats span { display: block; font-family: var(--font-ui); font-size: 0.74rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--marron-tierra); }
  .stats strong { display: block; margin-top: 0.3rem; font-family: var(--font-display); font-size: 1.45rem; font-weight: 600; color: var(--brand); }
</style>
</head>
<body>
  <div class="stats">
    <div><span>Valor</span><strong>USD 145.000</strong></div>
    <div><span>Superficie</span><strong>1.200 m²</strong></div>
    <div><span>Geo</span><strong>-40.1259, -71.2515</strong></div>
  </div>
</body>
</html>
