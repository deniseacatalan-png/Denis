<!-- @dsCard group="Type" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 26px 28px; background: var(--surface-solid); }
  .label { font-family: var(--font-ui); font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 10px; }
  .ui { font-family: var(--font-ui); color: var(--fg-1); }
  .w400 { font-weight: 400; font-size: 17px; }
  .w600 { font-weight: 600; font-size: 17px; }
  .w800 { font-weight: 800; font-size: 17px; }
  .stack > div { margin-bottom: 9px; }
  .tag { display: inline-block; width: 64px; color: var(--fg-3); font-size: 12px; font-weight: 700; }
  .meta { font-family: var(--font-ui); font-size: 12px; color: var(--fg-2); margin-top: 14px; }
</style>
</head>
<body>
  <div class="label">UI / Data · Manrope</div>
  <div class="stack ui">
    <div><span class="tag">400</span><span class="w400">Buscá tu próxima propiedad en la Patagonia</span></div>
    <div><span class="tag">600</span><span class="w600">San Martín de los Andes · Neuquén</span></div>
    <div><span class="tag">800</span><span class="w800">USD 145.000 · 1.200 m²</span></div>
  </div>
  <div class="meta">Weights 400–800 · forms, tables, navigation, metrics & counters. Set with mild tracking for uppercase labels.</div>
</body>
</html>
