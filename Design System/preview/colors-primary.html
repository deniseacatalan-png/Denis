<!-- @dsCard group="Colors" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px; background: var(--surface-solid); }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow-soft); }
  .chip { height: 84px; }
  .meta { padding: 10px 12px; background: #fff; }
  .name { font-family: var(--font-ui); font-weight: 700; font-size: 13px; color: var(--fg-1); }
  .hex { font-family: var(--font-ui); font-size: 12px; color: var(--fg-2); letter-spacing: 0.04em; margin-top: 2px; }
  .role { font-family: var(--font-display); font-style: italic; font-size: 12px; color: var(--fg-3); margin-top: 3px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#d9a8ad"></div><div class="meta"><div class="name">Rosa Nude</div><div class="hex">#D9A8AD</div><div class="role">Soft tints, light fields</div></div></div>
    <div class="sw"><div class="chip" style="background:#c97aa8"></div><div class="meta"><div class="name">Rosa Magenta</div><div class="hex">#C97AA8</div><div class="role">Bright rose accent</div></div></div>
    <div class="sw"><div class="chip" style="background:#a86f7a"></div><div class="meta"><div class="name">Rosa Profundo</div><div class="hex">#A86F7A</div><div class="role">Primary rose</div></div></div>
    <div class="sw"><div class="chip" style="background:#8e6a96"></div><div class="meta"><div class="name">Malva</div><div class="hex">#8E6A96</div><div class="role">Rose→violet bridge</div></div></div>
    <div class="sw"><div class="chip" style="background:#6e4f82"></div><div class="meta"><div class="name">Violeta</div><div class="hex">#6E4F82</div><div class="role">Deep accent / brand</div></div></div>
    <div class="sw"><div class="chip" style="background:#4d3661"></div><div class="meta"><div class="name">Violeta Profundo</div><div class="hex">#4D3661</div><div class="role">Headings, depth</div></div></div>
  </div>
</body>
</html>
